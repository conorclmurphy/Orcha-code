<!-- Orcha Events: Testimonials section on the home page (sits just above the enquiry form) -->
<style>
#orcha-testimonials{background:#212e21;padding:clamp(48px,7vw,96px) clamp(18px,5vw,64px);font-family:"Nunito Sans",sans-serif;color:#f4f3e8;position:relative;z-index:1}
#orcha-testimonials *{box-sizing:border-box}
#orcha-testimonials .ot-wrap{max-width:1180px;margin:0 auto}
#orcha-testimonials h2{font-family:"Sansita",sans-serif;font-weight:700;font-size:clamp(32px,4.2vw,48px);line-height:1.1;color:#ebfc72;text-align:center;margin:0 0 clamp(26px,4vw,44px)}
#orcha-testimonials .ot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.4vw,28px);align-items:stretch}
#orcha-testimonials figure{margin:0;display:flex;flex-direction:column;padding:clamp(22px,3vw,36px);border-radius:20px;background:rgba(244,243,232,.05);border:1px solid rgba(235,252,114,.28)}
#orcha-testimonials .ot-mark{font-family:"Sansita",sans-serif;font-size:64px;line-height:.7;color:#ebfc72;height:34px}
#orcha-testimonials blockquote{margin:0;padding:0;border:0;font-style:italic;font-size:16.5px;line-height:1.65;color:#f4f3e8}
#orcha-testimonials blockquote p{margin:0 0 14px;font-size:inherit;line-height:inherit;color:inherit}
#orcha-testimonials figcaption{margin-top:auto;padding-top:18px;border-top:1px solid rgba(235,252,114,.22);display:flex;flex-direction:column;gap:2px}
#orcha-testimonials figcaption strong{font-family:"Sansita",sans-serif;font-weight:700;font-size:20px;color:#ebfc72}
#orcha-testimonials figcaption span{font-size:14px;color:rgba(244,243,232,.75)}
@media (max-width:820px){#orcha-testimonials .ot-grid{grid-template-columns:1fr}#orcha-testimonials blockquote{font-size:15.5px}}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  if(location.pathname!=='/'&&location.pathname!=='/home')return;
  var e=document.getElementById('enquiremain');
  if(!e||document.getElementById('orcha-testimonials'))return;
  var s=document.createElement('section');
  s.id='orcha-testimonials';
  s.innerHTML='<div class="ot-wrap"><h2>Testimonials</h2><div class="ot-grid">'
  +'<figure><div class="ot-mark" aria-hidden="true">“</div><blockquote>'
  +'<p>A few weeks ago, Orcha Events provided the entertainment for one of our flagship events at the Guinness Storehouse, attended by more than 500 guests. The traditional Irish band created a fantastic atmosphere. Following the band, Conor performed as a solo musician, and he was a huge hit with our guests. In fact, his performance proved so popular that one of the event spaces reached capacity as attendees gathered to watch!</p>'
  +'<p>From the initial communication and planning through to the on-the-day logistics and performances themselves, Orcha Events were a pleasure to work with and exceeded our expectations. The combination of the traditional Irish band and Conor’s solo performance brought fantastic energy and variety to the event and played a big part in making the evening such a success.</p>'
  +'<p>I wouldn’t hesitate to recommend Orcha Events for any event and look forward to working with them again in the future. Their professionalism, organisation and quality of entertainment made the entire experience seamless, and they delivered an unforgettable evening for our guests.</p>'
  +'</blockquote><figcaption><strong>Operations Manager, Two Circles</strong><span>Flagship event at the Guinness Storehouse</span></figcaption></figure>'
  +'<figure><div class="ot-mark" aria-hidden="true">“</div><blockquote>'
  +'<p>I just wanted to drop you a note to say that our musician was absolutely amazing at our summer party. Everyone had a fantastic time, and the music was a huge hit with the group.</p>'
  +'<p>The atmosphere was exactly what we had hoped for, and we received lots of positive feedback from attendees throughout the evening.</p>'
  +'<p>Thank you also for all of your help in organising everything. The entire process was seamless from start to finish.</p>'
  +'<p>We will definitely be in touch with you again for future events.</p>'
  +'</blockquote><figcaption><strong>Arthur Cox</strong><span>Summer party</span></figcaption></figure>'
  +'</div></div>';
  e.parentNode.insertBefore(s,e);
});
</script>
